<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AI TabTool · Remote</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=1.87">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">AT</span>
      <span class="brand-name">AI TABTOOL</span>
      <span id="version-tag" class="version">v1.87</span>
    </div>
    <nav class="nav" aria-label="Päävalikko">
      <a href="/">DISPLAY</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main class="shell remote-shell">
    <section class="hero remote-hero">
      <div class="remote-hero-text">
        <p class="kicker">REMOTE</p>
        <h1>Kaukosäädin.</h1>
        <p class="lede">
          Pidä tämä sivu auki puhelimessa ja TV-näkymä tietokoneella.
          Molemmat käyttävät samaa lokaalia palvelinta.
        </p>
        <p class="status-pill" id="api-status" aria-live="polite">Checking…</p>
        <p class="muted" id="api-detail">
          <span id="api-version">/api/health</span> · <span id="tv-status">TV</span>
        </p>
      </div>
      <aside id="remote-pair" class="remote-pair" hidden
             aria-label="QR-koodi puhelimelle">
        <img id="remote-qr" class="remote-qr" width="150" height="150"
             alt="QR-koodi puhelimelle">
        <p id="remote-url" class="remote-url">…</p>
        <p id="remote-hint" class="muted"></p>
      </aside>
    </section>

    <section class="remote-panel" aria-label="Toiston hallinta">
      <div class="remote-now">
        <strong id="remote-title">–</strong>
        <span id="remote-meta" class="muted">Tahti – · 0:00 / 0:00</span>
      </div>
      <div class="remote-controls">
        <button id="remote-back" type="button" class="ghost">−5 s</button>
        <button id="remote-play" type="button" class="primary play">PLAY</button>
        <button id="remote-forward" type="button" class="ghost">+5 s</button>
      </div>
      <label class="remote-field">
        <span>Toisto</span>
        <input id="remote-seek" class="remote-slider" type="range"
               min="0" max="0" step="0.1" value="0"
               aria-label="Toistokohta">
      </label>
      <label class="remote-field">
        <span>Nopeus</span>
        <input id="remote-rate" class="remote-slider" type="range"
               min="0.5" max="1.5" step="0.001" value="1"
               aria-label="Audion nopeus">
        <span id="remote-rate-readout" class="muted">100.0%</span>
      </label>
    </section>

    <section class="remote-library-card" aria-label="Kirjasto">
      <h2>Kirjasto</h2>
      <div id="remote-library" class="remote-library"></div>
      <p id="remote-status" class="muted" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <span>AI TabTool v1.87</span>
    <span><a href="/">Takaisin näkymään</a></span>
  </footer>

  <script src="/static/remote.js?v=1.87" defer></script>
</body>
</html>
