<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI TabTool</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=1.22">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">AT</span>
      <span class="brand-name">AI TABTOOL</span>
      <span id="version-tag" class="version">v1.22</span>
    </div>
    <nav class="nav" aria-label="Päävalikko">
      <a href="/remote">REMOTE</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main class="shell">
    <section class="hero">
      <p class="kicker">PHASE 2 · GENERAATTORI</p>
      <h1>Kitaratablatuurit<br>lokaalisti.</h1>
      <p class="lede">
        Valitse oma audio tai liitä YouTube-linkki. Tab generoidaan
        paikallisesti, näytetään alphaTabilla ja soitetaan samasta audiolähteestä.
      </p>
    </section>

    <section class="studio" aria-label="Generaattori">
      <form id="source-form" class="card studio-form">
        <div class="field-row">
          <label class="field">
            <span>Oma audio</span>
            <input id="file-input" type="file"
                   accept=".mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.aiff,.aif,.webm">
          </label>
          <label class="field">
            <span>tai YouTube-linkki</span>
            <input id="url-input" type="url" inputmode="url"
                   placeholder="https://youtu.be/…" autocomplete="off">
          </label>
        </div>

        <div class="field-row compact">
          <label class="field small">
            <span>Viritys</span>
            <select id="tuning-select">
              <option value="standard" selected>Standard E</option>
              <option value="drop_d">Drop D</option>
              <option value="eb_standard">Eb Standard</option>
              <option value="d_standard">D Standard</option>
              <option value="open_g">Open G</option>
            </select>
          </label>
          <label class="field small">
            <span>Grid</span>
            <select id="grid-select">
              <option value="8">1/8</option>
              <option value="16" selected>1/16</option>
              <option value="32">1/32</option>
            </select>
          </label>
          <label class="field checkbox">
            <input id="quick-checkbox" type="checkbox">
            <span>Nopea tila (ei stemmoja)</span>
          </label>
          <label class="field checkbox">
            <input id="regenerate-checkbox" type="checkbox">
            <span>Generoi uudelleen</span>
          </label>
        </div>

        <div class="actions">
          <button id="generate-button" type="submit" class="primary">GENERATE TAB</button>
          <p id="job-status" class="job-status" aria-live="polite"></p>
          <progress id="job-progress" class="job-progress" max="1" value="0" hidden></progress>
        </div>
        <p id="job-detail" class="muted job-detail"></p>
      </form>

      <div id="library" class="library" aria-label="Tab-kirjasto" hidden></div>
    </section>

    <section id="viewer-section" class="viewer-section" hidden>
      <div class="viewer-bar">
        <button id="play-button" type="button" class="primary play">PLAY</button>
        <div class="viewer-meta">
          <strong id="tab-title"></strong>
          <span id="tab-meta" class="tab-meta"></span>
        </div>
        <div class="exports">
          <span class="export-label">EXPORT</span>
          <a data-format="gp5" href="#" download>GP5</a>
          <a data-format="musicxml" href="#" download>MusicXML</a>
          <a data-format="midi" href="#" download>MIDI</a>
        </div>
      </div>
      <div id="alphaTab" class="alphatab" aria-label="Tablatuuri"></div>
      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>

  <footer class="footer">
    <span>AI TabTool v1.22</span>
    <span>Local-first · <a href="/remote">Remote</a></span>
  </footer>

  <script src="/static/vendor/alphaTab/alphaTab.min.js?v=1.22"></script>
  <script src="/static/app.js?v=1.22" defer></script>
</body>
</html>
